# Example tool settings.  Merge these into the project's pyproject.toml.
[project]
requires-python = ">=3.12"

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 80
indent-width = 2

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import order
  "B",    # bugbear
  "SIM",  # simplify
  "C90",  # complexity
  "PLR",  # pylint refactor: arguments, statements, magic values
  "Q"     # quotes
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 3

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913"]

[tool.pyright]
typeCheckingMode = "strict"
